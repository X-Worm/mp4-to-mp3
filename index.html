<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP4 to MP3 Converter</title>
  <script src="coi-serviceworker.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --pico-font-size: 16px;
    }

    body > main {
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      text-align: center;
      opacity: 0.6;
      margin-bottom: 2rem;
    }

    .drop-zone {
      border: 2px dashed var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--pico-primary);
      background: var(--pico-primary-focus);
    }

    .drop-zone p {
      margin: 0;
    }

    .drop-zone .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .drop-zone .hint {
      font-size: 0.85rem;
      opacity: 0.5;
      margin-top: 0.5rem;
    }

    .file-info {
      display: none;
      margin-top: 1.5rem;
    }

    .file-info.visible {
      display: block;
    }

    .file-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--pico-card-background-color);
      border-radius: var(--pico-border-radius);
      margin-bottom: 1rem;
    }

    .file-name {
      font-weight: 600;
      word-break: break-all;
    }

    .file-size {
      opacity: 0.6;
      white-space: nowrap;
      margin-left: 1rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .actions button {
      flex: 1;
    }

    #convertBtn {
      flex: 2;
    }

    .progress-area {
      display: none;
      margin-top: 1.5rem;
    }

    .progress-area.visible {
      display: block;
    }

    .status-text {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .result-area {
      display: none;
      margin-top: 1.5rem;
      text-align: center;
    }

    .result-area.visible {
      display: block;
    }

    .result-area a[role="button"] {
      display: inline-block;
    }

    .error-area {
      display: none;
      margin-top: 1.5rem;
    }

    .error-area.visible {
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>MP4 to MP3</h1>
    <p class="subtitle">Convert video to audio directly in your browser. No upload, no server.</p>

    <div class="drop-zone" id="dropZone">
      <div class="icon">&#127916;</div>
      <p><strong>Drop your MP4 file here</strong></p>
      <p class="hint">or click to browse</p>
      <input type="file" id="fileInput" accept="video/mp4,video/*,.mp4,.mkv,.avi,.mov,.webm" hidden>
    </div>

    <div class="file-info" id="fileInfo">
      <div class="file-details">
        <span class="file-name" id="fileName"></span>
        <span class="file-size" id="fileSize"></span>
      </div>
      <div class="actions">
        <button id="convertBtn">Convert to MP3</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="progress-area" id="progressArea">
      <p class="status-text" id="statusText">Loading FFmpeg...</p>
      <progress id="progressBar" max="100" value="0"></progress>
    </div>

    <div class="result-area" id="resultArea">
      <p>Conversion complete!</p>
      <a role="button" id="downloadBtn" download>Download MP3</a>
    </div>

    <article class="error-area" id="errorArea">
      <p id="errorText"></p>
    </article>

    <footer>
      All processing happens locally in your browser using FFmpeg.wasm. Your files never leave your device.
    </footer>
  </main>

  <script type="module">
    import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/+esm';
    import { fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/+esm';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const convertBtn = document.getElementById('convertBtn');
    const clearBtn = document.getElementById('clearBtn');
    const progressArea = document.getElementById('progressArea');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const errorArea = document.getElementById('errorArea');
    const errorText = document.getElementById('errorText');

    let selectedFile = null;
    let ffmpeg = null;

    // Format bytes to human-readable string
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // Derive output filename
    function getOutputName(inputName) {
      return inputName.replace(/\.[^.]+$/, '') + '.mp3';
    }

    // Show / hide UI sections
    function showFileInfo(file) {
      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = formatSize(file.size);
      fileInfo.classList.add('visible');
      resultArea.classList.remove('visible');
      errorArea.classList.remove('visible');
      progressArea.classList.remove('visible');
    }

    function resetUI() {
      selectedFile = null;
      fileInput.value = '';
      fileInfo.classList.remove('visible');
      progressArea.classList.remove('visible');
      resultArea.classList.remove('visible');
      errorArea.classList.remove('visible');
      progressBar.value = 0;
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorArea.classList.add('visible');
      progressArea.classList.remove('visible');
    }

    // Drag-and-drop
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) showFileInfo(file);
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) showFileInfo(file);
    });

    clearBtn.addEventListener('click', resetUI);

    // Load FFmpeg
    async function loadFFmpeg() {
      if (ffmpeg) return ffmpeg;

      ffmpeg = new FFmpeg();

      ffmpeg.on('progress', ({ progress }) => {
        const pct = Math.round(progress * 100);
        progressBar.value = pct;
        statusText.textContent = `Converting... ${pct}%`;
      });

      statusText.textContent = 'Loading FFmpeg (first time may take a moment)...';
      progressArea.classList.add('visible');
      progressBar.removeAttribute('value'); // indeterminate

      await ffmpeg.load({
        coreURL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.js',
        wasmURL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.wasm',
      });

      return ffmpeg;
    }

    // Convert
    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      convertBtn.disabled = true;
      clearBtn.disabled = true;
      resultArea.classList.remove('visible');
      errorArea.classList.remove('visible');

      try {
        const ff = await loadFFmpeg();

        statusText.textContent = 'Reading file...';
        progressBar.removeAttribute('value');
        progressArea.classList.add('visible');

        const inputName = 'input' + selectedFile.name.replace(/[^a-zA-Z0-9.]/g, '_');
        const outputName = 'output.mp3';

        await ff.writeFile(inputName, await fetchFile(selectedFile));

        statusText.textContent = 'Converting...';
        progressBar.value = 0;

        await ff.exec(['-i', inputName, '-vn', '-acodec', 'libmp3lame', '-q:a', '2', outputName]);

        const data = await ff.readFile(outputName);

        // Clean up ffmpeg filesystem
        await ff.deleteFile(inputName);
        await ff.deleteFile(outputName);

        const blob = new Blob([data.buffer], { type: 'audio/mpeg' });
        const url = URL.createObjectURL(blob);

        downloadBtn.href = url;
        downloadBtn.download = getOutputName(selectedFile.name);
        downloadBtn.textContent = 'Download ' + getOutputName(selectedFile.name);

        progressArea.classList.remove('visible');
        resultArea.classList.add('visible');
      } catch (err) {
        console.error(err);
        showError('Conversion failed: ' + err.message);
      } finally {
        convertBtn.disabled = false;
        clearBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
